<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BattleShips Pro</title>
    <style>
      /* Minimal reset + dark naval theme. Module-specific styles live with
         their modules; only the root layout contract is defined here.

         PALETTE LOCKSTEP: these :root vars are ONE of two copies of the
         palette — render/theme.ts holds the matching canvas hexes (TEAM_COLOR,
         GOLD, NEUTRAL_COLOR, INK*, water + HP ramps). Change them together.
         HUD reads var(--…); canvas reads theme.ts. */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        /* Surfaces — a deep, cool naval night graded in clear steps so panels
           read as layered glass over the sea without muddying the field. */
        --bg-deep: #061019;
        --bg-panel: #0e2233;
        --bg-panel-raised: #18415f;
        --border: #305777;
        /* A brighter hairline for emphasis edges (focused inputs, framed cards). */
        --border-bright: #4a7ba1;
        /* Ink — high-contrast cool white + a legible dim for secondary text. */
        --text: #dde9f4;
        --text-dim: #8aa4ba;
        /* Accent (selection, links, interactive edges) — a clean signal cyan. */
        --accent: #3aa9ff;
        /* Currencies. */
        --gold: #f4c95c;
        --lumber: #95cb6f;
        /* Teams — warm red south, cool blue north (mirror theme.ts TEAM_COLOR;
           kept unmistakable at gameplay zoom). */
        --team-south: #ff5c5c;
        --team-north: #5c8aff;
        --danger: #ff5c5c;
        /* Positive / ready cue (cooldown done, affordable, in-range). */
        --ready: #52d273;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: var(--bg-deep);
        color: var(--text);
        font-family:
          'Inter',
          'Segoe UI',
          system-ui,
          -apple-system,
          'Helvetica Neue',
          sans-serif;
        font-size: 14px;
        line-height: 1.4;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        user-select: none;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }
      /* PixiJS canvas mount — owned by client-render. */
      #stage {
        position: absolute;
        inset: 0;
      }
      #stage canvas {
        display: block;
      }
      /* In-match DOM overlay — owned by client-hud. Pointer events off at the
         root; interactive HUD children opt back in. */
      #hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
      /* Fullscreen lobby/menu screens — owned by client-net. */
      #screens {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 20;
      }
      #screens[hidden] {
        display: none;
      }
      .panel {
        background: var(--bg-panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 22px 26px;
        min-width: 320px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage"></div>
      <div id="hud" hidden></div>
      <div id="screens"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
